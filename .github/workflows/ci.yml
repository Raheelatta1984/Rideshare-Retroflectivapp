name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to 40-character commit SHAs: a moved tag can point at
      # different code tomorrow, and a workflow token is worth stealing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: No credentials in web storage
        run: npm run security:storage
      - name: Dependency audit (High/Critical)
        run: npm run audit
      - name: Build
        run: npm run build
      - name: Build artifact checks
        run: npm run smoke
