name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to 40-character commit SHAs: a moved tag can point at
      # different code tomorrow, and a workflow token is worth stealing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: No credentials in web storage
        run: npm run security:storage
      - name: Database policy audit (real Postgres, PGlite)
        run: npm run security:rls
      - name: Dependency audit (High/Critical)
        run: npm run audit
      - name: Build
        run: npm run build
      - name: Build artifact checks
        run: npm run smoke
      - name: Build the session service (BFF)
        run: npm run bff:build
      - name: Session service smoke (real HTTP)
        run: npm run bff:smoke
