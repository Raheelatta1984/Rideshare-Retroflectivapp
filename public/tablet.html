<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Retroflex Tablet Display</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #050505;
        color: #f4ede1;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100dvh;
        padding: 24px;
      }
      main { max-width: 420px; text-align: center; width: 100%; }
      .mark { color: #e8a317; font-size: 42px; line-height: 1; }
      p { color: #9a958c; line-height: 1.5; }
      input {
        background: #111113;
        border: 1px solid #343438;
        border-radius: 16px;
        color: #f4ede1;
        font-family: monospace;
        font-size: 28px;
        letter-spacing: .25em;
        margin-top: 18px;
        padding: 16px;
        text-align: center;
        text-transform: uppercase;
        width: 100%;
      }
      button {
        background: #e8a317;
        border: 0;
        border-radius: 16px;
        color: #050505;
        font-size: 16px;
        font-weight: 700;
        margin-top: 14px;
        padding: 16px;
        width: 100%;
      }
      .small { font-size: 12px; letter-spacing: .12em; margin-top: 24px; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">△</div>
      <p class="small">Retroflex · Rear Tablet</p>
      <h1>Connect this display</h1>
      <p>Scan the driver QR code to connect automatically. Or enter the six-character pairing code below.</p>
      <form id="pair-form">
        <input id="pair-code" aria-label="Pair code" autocomplete="off" autocapitalize="characters" maxlength="6" placeholder="7K2M9Q" />
        <button type="submit">Arm display</button>
      </form>
    </main>
    <script>
      (function () {
        var code = new URLSearchParams(window.location.search).get("display");
        var root = window.location.pathname.replace(/tablet\.html$/, "");
        if (!root.endsWith("/")) root += "/";
        function openDisplay(value) {
          var clean = String(value || "").replace(/[^a-z0-9]/gi, "").toUpperCase();
          if (clean.length !== 6) return;
          window.location.replace(root + "?display=" + encodeURIComponent(clean));
        }
        if (code) openDisplay(code);
        document.getElementById("pair-form").addEventListener("submit", function (event) {
          event.preventDefault();
          openDisplay(document.getElementById("pair-code").value);
        });
      })();
    </script>
  </body>
</html>
