; PgBouncer for the Retroflex Postgres data plane.
;
; Transaction pooling is the point: display polls, event inserts and console
; reads are short statements that would otherwise pin a full server connection
; each. With `pool_mode = transaction`, thousands of app clients share tens of
; server connections.
;
; Transaction-mode rules the app code is written around (server/db/pgbouncer.ts):
;   - no session state survives a checkout (SET, temp tables, LISTEN,
;     session advisory locks) — use withTransaction()/withConnection()
;   - no named prepared statements — the client sends SQL text + parameters
;   - statement caches are disabled here (`query_cache_size = 0`) so a cached
;     plan from one client is never replayed for another
;
; Neon users: you usually do NOT run this file — Neon operates the pooler for
; you at `ep-…-pooler.aws.neon.tech` (see `toPoolerUrl()`). This config is for
; self-hosted Postgres/Supabase where you run PgBouncer yourself.

[databases]
; `direct` is the raw primary. Host comes from the environment at container
; start (see infra/docker-compose.yml); keep credentials in userlist.txt or
; an auth_file, never in this file.
retroflex = host=${POSTGRES_HOST} port=5432 dbname=${POSTGRES_DB}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; The core setting: one server connection per transaction, not per client.
pool_mode = transaction

; Server-side pool: connections to Postgres per (user, database).
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Client-side limit: total app connections this pooler accepts.
max_client_connections = 500

; Recycle idle/old server connections.
server_idle_timeout = 120
server_lifetime = 3600
server_connect_timeout = 15

; How long a query may wait for a free server connection before failing loud
; (a slow queue is better diagnosed than silently stacked up).
query_wait_timeout = 120

; Client drivers send parameters the pooler must forward, not choke on:
; node-pg sends `extra_float_digits`, Prisma sends `plan_cache_mode`, etc.
ignore_startup_parameters = extra_float_digits,plan_cache_mode,application_name

; Never cache prepared statements across clients in transaction mode.
query_cache_size = 0
prepared_statement_cache_size = 0

; Ops visibility.
stats_period = 60
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
application_name_add_host = 1

; TLS to clients (terminate here or at the load balancer).
client_tls_sslmode = prefer
server_tls_sslmode = prefer
