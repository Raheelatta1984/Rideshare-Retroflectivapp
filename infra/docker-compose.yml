# Local development stack for the Retroflex server data plane:
#
#   postgres:16   the database (stand-in for Neon or a self-hosted primary)
#   pgbouncer     transaction-mode pooler in front of it (infra/pgbouncer/)
#   memcached     read-through cache for the hot read paths
#
# This stack exists for developing/verifying `server/` locally. Production
# uses Neon's hosted pooler (or your own PgBouncer) and a managed memcached —
# see INFRASTRUCTURE.md. The browser app itself needs none of this: it runs
# the local adapter or talks to Supabase over REST.
#
#   docker compose -f infra/docker-compose.yml up
#   docker compose -f infra/docker-compose.yml --profile bff up   # + session service
#
# Endpoints after `up`:
#   postgres  localhost:5432  (user retroflex / password retroflex / db retroflex)
#   pgbouncer localhost:6543  (same credentials — point DATABASE_URL here)
#   memcached localhost:11211
#   bff       localhost:8080  (profile "bff": SPA + /bff on one origin)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retroflex
      POSTGRES_PASSWORD: retroflex
      POSTGRES_DB: retroflex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-apply the schema on first boot (0001–0004).
      - ../../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retroflex -d retroflex"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: retroflex
      DB_PASSWORD: retroflex
      DB_NAME: retroflex
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      QUERY_CACHE_SIZE: "0"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6543:6543"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro

  # The session service (server/bff). Off by default so the data-plane stack
  # stays light: `docker compose --profile bff up`. It serves the built SPA and
  # /bff from one origin, which is what makes the HttpOnly session cookie work.
  bff:
    profiles: ["bff"]
    build:
      context: ..
      dockerfile: server/bff/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BFF_PORT: "8080"
      BFF_HOST: 0.0.0.0
      BFF_STATIC_DIR: /app/dist
      BFF_SESSION_STORE: postgres
      BFF_DATABASE_URL: postgres://retroflex:retroflex@pgbouncer:6543/retroflex
      # Development-only values. Generate real ones for any deployment:
      #   openssl rand -base64 32   (BFF_CSRF_SECRET and BFF_SESSION_KEY)
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-local-anon-key}
      BFF_CSRF_SECRET: ${BFF_CSRF_SECRET:-development-only-csrf-secret-change-me}
      BFF_SESSION_KEY: ${BFF_SESSION_KEY:-}
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8080:8080"

  memcached:
    image: memcached:1.6-alpine
    # 64 MB is plenty for campaign lists, terminal directories and asset
    # metadata; raise -m with the fleet size.
    command: ["memcached", "-m", "64", "-I", "1m"]
    ports:
      - "11211:11211"

volumes:
  pgdata:
